; Configuration for the backend suite. pytest.ini wins over the [tool.pytest.ini_options] block
; in pyproject.toml when both exist, which is the arrangement W01 anticipated: the dependency set
; stays in pyproject and the test runner is configured here.
[pytest]
testpaths = tests
; Every async test in this suite drives real asyncio machinery: the single DuckDB writer task, the
; worker pool and the governor's limiter all live on the running loop. Auto mode means a test does
; not have to remember a marker to get one, and a test that forgets would otherwise pass by never
; running its own body.
asyncio_mode = auto
; A test that hangs is a test that has deadlocked on a lease, a gate or the writer queue, and a
; suite that hangs tells nobody which one. Every wait in this suite is bounded in the test itself.
filterwarnings =
    ignore::DeprecationWarning:duckdb
